<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceTime Planner Pro</title>
    <style>
        :root {
            --space-bg: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            --neon-blue: #00d4ff;
            --neon-pink: #ff0055;
            --glass-bg: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            background: var(--space-bg);
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Katmanlı Yıldız Alanı (Derinlik Efekti) */
        .space-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .stars {
            position: absolute;
            width: 200%; height: 200%;
            background: transparent;
            background-image: 
                radial-gradient(1px 1px at 10% 10%, #fff, transparent),
                radial-gradient(1px 1px at 20% 50%, #fff, transparent),
                radial-gradient(2px 2px at 40% 80%, #00d4ff, transparent),
                radial-gradient(1px 1px at 60% 20%, #fff, transparent),
                radial-gradient(2px 2px at 80% 40%, #ff0055, transparent);
            background-size: 300px 300px;
            animation: spaceDrive 120s linear infinite;
            opacity: 0.6;
        }

        @keyframes spaceDrive {
            from { transform: translate(0, 0); }
            to { transform: translate(-150px, -300px); }
        }

        /* Üst Başlık */
        header {
            text-align: center;
            padding: 60px 20px 20px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 8px;
            background: linear-gradient(to right, #fff, var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.5));
            margin: 0;
        }

        .quote {
            color: var(--neon-blue);
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-top: 15px;
            opacity: 0.8;
        }

        /* Ana Panel */
        .main-content {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            width: 90%;
        }

        section {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        section:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
            transform: scale(1.02);
        }

        h2 {
            font-size: 1.2rem;
            margin-top: 0;
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* İnput ve Butonlar */
        input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            width: calc(100% - 100px);
            outline: none;
        }

        button {
            background: transparent;
            color: #fff;
            border: 1px solid var(--neon-blue);
            padding: 12px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 0.8rem;
        }

        button:hover {
            background: var(--neon-blue);
            box-shadow: 0 0 20px var(--neon-blue);
            color: #000;
        }

        /* Zamanlayıcı Ekranı */
        #timerDisplay {
            font-family: 'Courier New', Courier, monospace;
            font-size: 3.5rem;
            text-align: center;
            color: var(--neon-pink);
            text-shadow: 0 0 20px var(--neon-pink);
            margin: 20px 0;
        }

        /* Liste Öğeleri */
        ul { list-style: none; padding: 0; }
        li {
            background: rgba(255, 255, 255, 0.03);
            margin: 10px 0;
            padding: 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>
    <div class="space-container">
        <div class="stars"></div>
    </div>

    <header>
        <h1>SpaceTime</h1>
        <p class="quote" id="quoteDisplay"></p>
    </header>

    <div class="main-content">
        <section>
            <h2>Görev Üssü</h2>
            <div style="display: flex; gap: 10px;">
                <input id="taskInput" placeholder="Sıradaki görevin nedir?" />
                <button onclick="addTask()">Aktar</button>
            </div>
            <ul id="taskList"></ul>
        </section>

        <section>
            <h2>Hiper-Zamanlayıcı</h2>
            <div style="text-align: center;">
                <div id="timerDisplay">25:00</div>
                <input id="timerMinutes" type="number" value="25" style="width: 60px; text-align: center;"/>
                <button onclick="startTimer()">Geri Sayımı Başlat</button>
            </div>
        </section>

        <section>
            <h2>Veri Analizi</h2>
            <button onclick="analyzeDay()" style="width: 100%;">Günü Raporla</button>
            <div id="analysisResult" style="margin-top:20px; font-size: 0.9rem; color: #aaa;"></div>
        </section>
    </div>

    <script>
        const quotes = [
            "Yıldızlara ulaşmak için önce yerden kalkmalısın.",
            "Zaman, bükebileceğin tek boyuttur.",
            "Bugünün emeği, yarının galaksisini kurar.",
            "Evren, cesurları her zaman ödüllendirir.",
            "Odaklanma, en büyük süper gücündür."
        ];

        document.getElementById("quoteDisplay").innerText = quotes[Math.floor(Math.random() * quotes.length)];

        function addTask() {
            const inp = document.getElementById("taskInput");
            if (!inp.value) return;
            const li = document.createElement("li");
            li.innerHTML = `<span style="color:var(--neon-blue); margin-right:10px;">◈</span> ${inp.value}`;
            document.getElementById("taskList").appendChild(li);
            inp.value = "";
        }

        let timerInterval;
        function startTimer() {
            clearInterval(timerInterval);
            let mins = parseInt(document.getElementById("timerMinutes").value);
            let secs = mins * 60;
            timerInterval = setInterval(() => {
                secs--;
                const m = Math.floor(secs / 60);
                const s = secs % 60;
                document.getElementById("timerDisplay").innerText = 
                    (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
                if (secs <= 0) {
                    clearInterval(timerInterval);
                    alert("Görev Süresi Tamamlandı!");
                }
            }, 1000);
        }

        function analyzeDay() {
            const tasks = document.getElementById("taskList").children.length;
            const res = document.getElementById("analysisResult");
            res.innerHTML = `
                <p>🚀 <strong>Sistem Notu:</strong> Bugün sisteme <strong>${tasks}</strong> veri girişi yapıldı.</p>
                <p>💡 Bu tempoyla devam edersen, kişisel üretkenlik katsayın standartların üzerine çıkacak.</p>
            `;
        }
    </script>
</body>
</html>
