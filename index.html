<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceTime Planner Pro - Multimedia Edition</title>
    <style>
        :root {
            --space-bg: #05070a;
            --neon-blue: #00d4ff;
            --neon-pink: #ff0055;
            --neon-purple: #bc13fe;
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0; background-color: var(--space-bg); color: #fff;
            font-family: 'Segoe UI', Roboto, sans-serif; min-height: 100vh;
            overflow-x: hidden; display: flex; flex-direction: column; align-items: center;
        }

        /* --- ARKA PLAN --- */
        .universe { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: radial-gradient(circle at center, #1b2735 0%, #05070a 100%); }
        .black-hole {
            position: absolute; top: 50%; left: 50%; width: 250px; height: 250px; background: #000; border-radius: 50%;
            transform: translate(-50%, -50%); box-shadow: 0 0 60px 20px #fff, 0 0 100px 50px var(--neon-purple);
            animation: pulse 8s infinite alternate;
        }
        @keyframes pulse { from { transform: translate(-50%, -50%) scale(1); opacity: 0.7; } to { transform: translate(-50%, -50%) scale(1.1); opacity: 0.9; } }

        /* --- MULTIMEDIA PANEL (YENİ) --- */
        .music-panel {
            position: fixed; right: -320px; top: 50%; transform: translateY(-50%);
            width: 300px; background: rgba(0,0,0,0.8); backdrop-filter: blur(20px);
            border: 1px solid var(--neon-blue); border-radius: 20px 0 0 20px;
            padding: 20px; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 100;
        }
        .music-panel.open { right: 0; }
        .panel-toggle {
            position: absolute; left: -50px; top: 50%; transform: translateY(-50%);
            background: var(--neon-blue); color: #000; border: none; padding: 15px 10px;
            border-radius: 10px 0 0 10px; cursor: pointer; font-weight: bold; writing-mode: vertical-rl;
        }

        /* --- ANA TASARIM --- */
        header { text-align: center; padding: 40px 0; z-index: 10; }
        h1 { font-size: 3rem; letter-spacing: 8px; margin: 0; background: linear-gradient(to bottom, #fff, var(--neon-blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .container { width: 90%; max-width: 700px; z-index: 10; padding-bottom: 50px; }
        section { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 25px; margin-bottom: 25px; }

        /* Zamanlayıcı & Analiz (Önceki Kodlarla Aynı) */
        #timerDisplay { font-family: 'Courier New', monospace; font-size: 4.5rem; text-align: center; color: var(--neon-pink); text-shadow: 0 0 20px var(--neon-pink); margin: 15px 0; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
        .stat-card { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px; text-align: center; border: 1px solid rgba(0,212,255,0.1); }
        .stat-val { display: block; font-size: 1.2rem; color: var(--neon-blue); }
        .stat-label { font-size: 0.6rem; color: #aaa; }

        /* Input & List */
        .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
        input { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 12px; border-radius: 12px; flex: 1; outline: none; }
        button { background: transparent; color: #fff; border: 1px solid var(--neon-blue); padding: 8px 15px; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; font-size: 0.7rem; }
        button:hover { background: var(--neon-blue); color: #000; }
        button.pause-mode { border-color: var(--neon-pink); color: var(--neon-pink); }

        ul { list-style: none; padding: 0; }
        li { background: rgba(255,255,255,0.03); margin: 10px 0; padding: 12px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; border-left: 3px solid var(--neon-blue); transition: 0.4s; }
        li.completed { opacity: 0.4; border-left-color: #555; }
        li.completed .task-text { text-decoration: line-through; }
        .task-content { flex: 1; cursor: pointer; }
    </style>
</head>
<body>

    <div class="universe"><div class="black-hole"></div></div>

    <!-- MÜZİK PANELİ -->
    <div class="music-panel" id="musicPanel">
        <button class="panel-toggle" onclick="togglePanel()">MÜZİK</button>
        <h3 style="color:var(--neon-blue); font-size: 0.8rem; margin-top:0;">MEDYA ÜSSÜ</h3>
        
        <!-- YOUTUBE EMBED (Lo-fi Girl Canlı Yayın) -->
        <iframe width="100%" height="160" src="https://www.youtube.com/embed/jfKfPfyJRdk" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen style="border-radius:10px; margin-bottom:15px;"></iframe>

        <!-- SPOTIFY EMBED (Sadece src kısmını kendi playlist linkinle değiştirebilirsin) -->
        <iframe style="border-radius:12px" src="https://open.spotify.com/embed/playlist/37i9dQZF1DWWQRwui0S6ez?utm_source=generator&theme=0" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>

    <header><h1>SPACETIME</h1></header>

    <div class="container">
        <section>
            <h2>GÖREV SÜRESİ</h2>
            <div id="timerDisplay">25:00</div>
            <div style="display:flex; justify-content:center; gap:10px;">
                <input id="timerMinutes" type="number" value="25" style="width: 50px;">
                <button id="mainBtn" onclick="toggleTimer()">BAŞLAT</button>
                <button onclick="resetTimer()">SIFIRLA</button>
            </div>
        </section>

        <section>
            <h2>ANALİZ</h2>
            <div class="stats-grid">
                <div class="stat-card"><span class="stat-val" id="dailyStat">0</span><span class="stat-label">GÜN</span></div>
                <div class="stat-card"><span class="stat-val" id="weeklyStat">0</span><span class="stat-label">HAFTA</span></div>
                <div class="stat-card"><span class="stat-val" id="monthlyStat">0</span><span class="stat-label">AY</span></div>
                <div class="stat-card"><span class="stat-val" id="yearlyStat">0</span><span class="stat-label">YIL</span></div>
            </div>
        </section>

        <section>
            <h2>HEDEFLER</h2>
            <div class="input-group">
                <input id="taskInput" placeholder="Hedef belirle..." onkeypress="if(event.key==='Enter') addTask()">
                <button onclick="addTask()">EKLE</button>
            </div>
            <ul id="taskList"></ul>
        </section>
    </div>

    <script>
        let timerInterval, remainingSeconds = 1500, isRunning = false;

        // Müzik Paneli Aç/Kapat
        function togglePanel() {
            document.getElementById("musicPanel").classList.toggle("open");
        }

        // --- ZAMANLAYICI ---
        function updateDisplay() {
            const m = Math.floor(remainingSeconds / 60);
            const s = remainingSeconds % 60;
            document.getElementById("timerDisplay").innerText = `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
        }

        function toggleTimer() {
            const btn = document.getElementById("mainBtn");
            if (!isRunning) {
                isRunning = true; btn.innerText = "DURDUR"; btn.classList.add("pause-mode");
                timerInterval = setInterval(() => {
                    if (remainingSeconds > 0) { remainingSeconds--; updateDisplay(); }
                    else { clearInterval(timerInterval); alert("Süre bitti!"); resetTimer(); }
                }, 1000);
            } else {
                isRunning = false; btn.innerText = "DEVAM ET"; btn.classList.remove("pause-mode");
                clearInterval(timerInterval);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval); isRunning = false;
            document.getElementById("mainBtn").innerText = "BAŞLAT";
            document.getElementById("mainBtn").classList.remove("pause-mode");
            remainingSeconds = document.getElementById("timerMinutes").value * 60;
            updateDisplay();
        }

        // --- ANALİZ & GÖREVLER ---
        function getAnalytics() {
            const tasks = JSON.parse(localStorage.getItem("spaceTasks") || "[]");
            const now = new Date();
            const count = (days) => tasks.filter(t => {
                if (!t.completed || !t.doneDate) return false;
                return (now - new Date(t.doneDate)) / (1000 * 60 * 60 * 24) <= days;
            }).length;
            document.getElementById("dailyStat").innerText = count(1);
            document.getElementById("weeklyStat").innerText = count(7);
            document.getElementById("monthlyStat").innerText = count(30);
            document.getElementById("yearlyStat").innerText = count(365);
        }

        function addTask() {
            const inp = document.getElementById("taskInput");
            if (!inp.value.trim()) return;
            const tasks = JSON.parse(localStorage.getItem("spaceTasks") || "[]");
            tasks.push({ text: inp.value.trim(), completed: false, id: Date.now() });
            localStorage.setItem("spaceTasks", JSON.stringify(tasks));
            renderTasks(); inp.value = "";
        }

        function toggleComplete(id) {
            let tasks = JSON.parse(localStorage.getItem("spaceTasks"));
            tasks = tasks.map(t => {
                if(t.id === id) {
                    t.completed = !t.completed;
                    t.doneDate = t.completed ? new Date().toISOString() : null;
                }
                return t;
            });
            localStorage.setItem("spaceTasks", JSON.stringify(tasks));
            renderTasks();
        }

        function deleteTask(id) {
            let tasks = JSON.parse(localStorage.getItem("spaceTasks"));
            localStorage.setItem("spaceTasks", JSON.stringify(tasks.filter(t => t.id !== id)));
            renderTasks();
        }

        function renderTasks() {
            const list = document.getElementById("taskList"); list.innerHTML = "";
            const tasks = JSON.parse(localStorage.getItem("spaceTasks") || "[]");
            tasks.forEach(t => {
                const li = document.createElement("li");
                if (t.completed) li.classList.add("completed");
                li.innerHTML = `<div class="task-content" onclick="toggleComplete(${t.id})">◈ ${t.text}</div><button class="delete-btn" onclick="deleteTask(${t.id})" style="border:none; color:var(--neon-pink); background:none; cursor:pointer;">SİL</button>`;
                list.appendChild(li);
            });
            getAnalytics();
        }

        window.onload = () => { renderTasks(); updateDisplay(); };
    </script>
</body>
</html>
