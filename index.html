<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceTime Planner Pro</title>
    <style>
        :root {
            --space-bg: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            --neon-blue: #00d4ff;
            --neon-pink: #ff0055;
            --glass-bg: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0;
            background: var(--space-bg);
            color: #fff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Arka Plan Yıldız Animasyonu */
        .space-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .stars {
            position: absolute;
            width: 200%; height: 200%;
            background: transparent;
            background-image: 
                radial-gradient(1px 1px at 10% 10%, #fff, transparent),
                radial-gradient(1px 1px at 20% 50%, #fff, transparent),
                radial-gradient(2px 2px at 40% 80%, var(--neon-blue), transparent),
                radial-gradient(1px 1px at 60% 20%, #fff, transparent),
                radial-gradient(2px 2px at 80% 40%, var(--neon-pink), transparent);
            background-size: 300px 300px;
            animation: spaceDrive 120s linear infinite;
            opacity: 0.6;
        }

        @keyframes spaceDrive {
            from { transform: translate(0, 0); }
            to { transform: translate(-150px, -300px); }
        }

        header {
            text-align: center;
            padding: 60px 20px 20px;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 8px;
            background: linear-gradient(to right, #fff, var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0, 212, 255, 0.5));
            margin: 0;
        }

        .quote {
            color: var(--neon-blue);
            font-size: 0.9rem;
            letter-spacing: 2px;
            margin-top: 15px;
            opacity: 0.8;
            min-height: 1.2em;
        }

        .main-content {
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
            width: 90%;
        }

        section {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        section:hover {
            border-color: var(--neon-blue);
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
            transform: scale(1.01);
        }

        h2 {
            font-size: 1.1rem;
            margin-top: 0;
            color: var(--neon-blue);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            flex: 1;
            outline: none;
        }

        button {
            background: transparent;
            color: #fff;
            border: 1px solid var(--neon-blue);
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        button:hover {
            background: var(--neon-blue);
            box-shadow: 0 0 15px var(--neon-blue);
            color: #000;
        }

        #timerDisplay {
            font-family: 'Courier New', Courier, monospace;
            font-size: 3.5rem;
            text-align: center;
            color: var(--neon-pink);
            text-shadow: 0 0 20px var(--neon-pink);
            margin: 15px 0;
        }

        ul { list-style: none; padding: 0; }
        li {
            background: rgba(255, 255, 255, 0.03);
            margin: 10px 0;
            padding: 12px 15px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: slideIn 0.4s ease-out;
            border-left: 3px solid var(--neon-blue);
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-15px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .delete-btn {
            border-color: var(--neon-pink) !important;
            color: var(--neon-pink) !important;
            padding: 5px 10px !important;
            font-size: 0.65rem !important;
        }

        .delete-btn:hover {
            background: var(--neon-pink) !important;
            color: #fff !important;
        }
    </style>
</head>
<body>
    <div class="space-container">
        <div class="stars"></div>
    </div>

    <header>
        <h1>SpaceTime</h1>
        <p class="quote" id="quoteDisplay"></p>
    </header>

    <div class="main-content">
        <section>
            <h2>Görev Üssü</h2>
            <div class="input-group">
                <input id="taskInput" placeholder="Sıradaki görevin nedir?" onkeypress="if(event.key==='Enter') addTask()"/>
                <button onclick="addTask()">Aktar</button>
            </div>
            <ul id="taskList"></ul>
        </section>

        <section>
            <h2>Hiper-Zamanlayıcı</h2>
            <div style="text-align: center;">
                <div id="timerDisplay">25:00</div>
                <div style="display: flex; justify-content: center; gap: 10px; align-items: center;">
                    <input id="timerMinutes" type="number" value="25" style="width: 60px; text-align: center;"/>
                    <button onclick="startTimer()">Başlat</button>
                </div>
            </div>
        </section>

        <section>
            <h2>Veri Analizi</h2>
            <button onclick="analyzeDay()" style="width: 100%;">Günü Raporla</button>
            <div id="analysisResult" style="margin-top:15px; font-size: 0.85rem; color: #aaa; line-height: 1.5;"></div>
        </section>
    </div>

    <script>
        const quotes = [
            "Yıldızlara ulaşmak için önce yerden kalkmalısın.",
            "Zaman, bükebileceğin tek boyuttur.",
            "Bugünün emeği, yarının galaksisini kurar.",
            "Evren, cesurları her zaman ödüllendirir.",
            "Odaklanma, en büyük süper gücündür."
        ];

        window.onload = () => {
            document.getElementById("quoteDisplay").innerText = quotes[Math.floor(Math.random() * quotes.length)];
            loadTasks();
        };

        function addTask() {
            const inp = document.getElementById("taskInput");
            if (!inp.value.trim()) return;
            
            const taskText = inp.value.trim();
            saveTaskToLocal(taskText);
            renderTask(taskText);
            inp.value = "";
        }

        function renderTask(text) {
            const li = document.createElement("li");
            li.innerHTML = `
                <div style="display:flex; align-items:center;">
                    <span style="color:var(--neon-blue); margin-right:12px;">◈</span> 
                    <span>${text}</span>
                </div>
                <button class="delete-btn" onclick="removeTask(this)">SİL</button>
            `;
            document.getElementById("taskList").appendChild(li);
        }

        function saveTaskToLocal(task) {
            let tasks = localStorage.getItem("spaceTasks") ? JSON.parse(localStorage.getItem("spaceTasks")) : [];
            tasks.push(task);
            localStorage.setItem("spaceTasks", JSON.stringify(tasks));
        }

        function loadTasks() {
            let tasks = localStorage.getItem("spaceTasks") ? JSON.parse(localStorage.getItem("spaceTasks")) : [];
            tasks.forEach(task => renderTask(task));
        }

        function removeTask(btn) {
            const li = btn.parentElement;
            const text = li.querySelector("span:nth-child(2)").innerText;
            li.style.opacity = '0';
            setTimeout(() => {
                li.remove();
                let tasks = JSON.parse(localStorage.getItem("spaceTasks"));
                tasks = tasks.filter(t => t !== text);
                localStorage.setItem("spaceTasks", JSON.stringify(tasks));
            }, 300);
        }

        let timerInterval;
        function startTimer() {
            clearInterval(timerInterval);
            let mins = parseInt(document.getElementById("timerMinutes").value);
            if(isNaN(mins) || mins <= 0) return;
            let secs = mins * 60;
            
            timerInterval = setInterval(() => {
                secs--;
                const m = Math.floor(secs / 60);
                const s = secs % 60;
                document.getElementById("timerDisplay").innerText = 
                    (m < 10 ? "0" + m : m) + ":" + (s < 10 ? "0" + s : s);
                
                if (secs <= 0) {
                    clearInterval(timerInterval);
                    alert("Görev Süresi Tamamlandı!");
                }
            }, 1000);
        }

        function analyzeDay() {
            const tasks = document.getElementById("taskList").children.length;
            const res = document.getElementById("analysisResult");
            res.innerHTML = `
                <p>🚀 <strong>Sistem Durumu:</strong> Şu an aktif <strong>${tasks}</strong> görev yörüngede bekliyor.</p>
                <p>✨ <strong>Tavsiye:</strong> Küçük adımlar, ışık yılı mesafeleri aşmanın tek yoludur. Bugün harika iş çıkardın!</p>
            `;
        }
    </script>
</body>
</html>
